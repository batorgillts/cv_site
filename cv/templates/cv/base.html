{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CV{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'cv/style.css' %}">
</head>
<body>
  <nav class="site-nav" aria-label="Site">
    <a href="{% url 'cv:home' %}">CV</a>
    <a href="{% url 'cv:contact' %}">Contact</a>
    <button type="button" class="print-btn" onclick="window.print()">Print or save as PDF</button>
  </nav>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    {% block footer %}Built with Django templates{% endblock %}
  </footer>
</body>
</html>
